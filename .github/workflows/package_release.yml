name: Package Release
on:
  push:
    tags:
      - "v*"
jobs:
  code_check:
    uses: ./.github/workflows/code_check.yml
    
  create_release:
    needs: code_check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Add SikuliX, CasperJS, SlimerJS and SikuliX-Linux dependency files
        run: |
          cd "${{github.workspace}}/src"
          
          # Add SikuliX and unx dependency files from the v6.110.0 release
          curl -L 'https://github.com/aisingapore/TagUI/releases/download/v6.110.0/TagUI_Windows.zip' > previous.zip
          unzip -q previous.zip 'tagui/src/sikulix/*' 'tagui/src/unx/*' -d previous
          rm previous.zip
          mv previous/tagui/src/sikulix sikulix
          
          # Add CasperJS dependency files
          curl -L 'https://github.com/casperjs/casperjs/archive/refs/tags/1.1.4-1.zip' > casperjs.zip
          unzip casperjs.zip
          rm casperjs.zip
          mv casperjs-1.1.4-1 casperjs
          
          # Add SlimerJS dependency files
          curl -L 'https://github.com/laurentj/slimerjs/releases/download/1.0.0/slimerjs-1.0.0.zip' > slimerjs.zip
          unzip slimerjs.zip
          rm slimerjs.zip
          mv slimerjs-1.0.0 slimerjs
          
          # Add PhantomJS dependency files
          curl -L 'https://bitbucket.org/ariya/phantomjs/downloads/phantomjs-2.1.1-linux-x86_64.tar.bz2' > phantomjs.tar.bz2
          tar -xf phantomjs.tar.bz2
          rm phantomjs.tar.bz2
          mv phantomjs-2.1.1-linux-x86_64 phantomjs
        
          cd "${{github.workspace}}"
          mkdir tagui
          rm -r .git
          shopt -s extglob dotglob
          mv !(tagui) tagui
          shopt -u dotglob
          
          sudo chmod -R 755 "${{github.workspace}}/tagui"
      
      - name: Zip Linux Folder
        run: |  
          cd "${{github.workspace}}"
          zip -r TagUI_Linux.zip tagui
          
      - name: Add PhantomJS-macOS dependency files (macOS)
        run: |          
          cd "${{github.workspace}}/tagui/src"
          
          # Add PhantomJS dependency files
          rm -r phantomjs
          
          # Add PhantomJS dependency files
          curl -L 'https://bitbucket.org/ariya/phantomjs/downloads/phantomjs-2.1.1-macosx.zip' > phantomjs.zip
          unzip phantomjs.zip
          rm phantomjs.zip
          mv phantomjs-2.1.1-macosx phantomjs
          sudo chmod -R 755 "${{github.workspace}}/tagui"
                    
      - name: Zip macOS Folder
        run: |  
          cd "${{github.workspace}}"
          zip -r TagUI_macOS.zip tagui
          
      - name: Add Unx, PHP, PhantomJS-Windows dependency files (Windows)
        run: |          
          cd "${{github.workspace}}/tagui/src"
          
          # Add unx dependencies
          mv previous/tagui/src/unx unx
          rm -r previous
                             
          # Add PHP dependency files
          curl -L 'https://windows.php.net/downloads/releases/archives/php-8.3.14-nts-Win32-vs16-x64.zip' > phpzip.zip
          mkdir php
          unzip phpzip.zip -d ./php
          rm phpzip.zip
          sed -e 's/^;extension_dir = "ext"/extension_dir = "ext"/' \
              -e 's/^;extension=curl/extension=curl/' \
              -e 's/^;extension=mbstring/extension=mbstring/' \
              -e 's/^;extension=openssl/extension=openssl/' \
              -e 's/^;extension=sockets/extension=sockets/' \
              php/php.ini-production > php/php.ini
          
          # Add PhantomJS dependency files
          rm -r phantomjs
          
          # Add PhantomJS dependency files
          curl -L 'https://bitbucket.org/ariya/phantomjs/downloads/phantomjs-2.1.1-windows.zip' > phantomjs.zip
          unzip phantomjs.zip
          rm phantomjs.zip
          mv phantomjs-2.1.1-windows phantomjs
          
          sudo chmod -R 755 "${{github.workspace}}/tagui"
          
      - name: Zip Windows Folder
        run: |  
          cd "${{github.workspace}}"
          zip -r TagUI_Windows.zip tagui
          
      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            TagUI_Windows.zip
            TagUI_macOS.zip
            TagUI_Linux.zip
