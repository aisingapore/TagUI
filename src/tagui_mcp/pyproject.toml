[project]
name = "tagui-mcp"
version = "0.2.0"
description = "MCP server that lets AI assistants drive TagUI"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = ["mcp>=2,<3", "uvicorn>=0.30"]

[project.scripts]
tagui-mcp = "tagui_mcp.__main__:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["tagui_mcp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
